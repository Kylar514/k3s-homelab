apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://10.0.40.11:8200
      path: secret
      version: v2
      auth:
        appRole:
          path: approle
          roleId: '{{ .Values.vault.roleId }}'
          secretRef:
            name: vault-approle
            namespace: external-secrets
            key: secret-id
