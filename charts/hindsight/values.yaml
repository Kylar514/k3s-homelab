image:
  repository: ghcr.io/vectorize-io/hindsight
  tag: '0.9.2'
  pullPolicy: IfNotPresent

llm:
  provider: opencode-go
  model: deepseek-v4-flash
  baseUrl: https://opencode.ai/zen/go/v1

storage:
  storageClass: nfs-fast
  size: 32Gi

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: '2'
    memory: 4Gi

externalSecret:
  key: secret/hindsight
  property: opencode-api-key
