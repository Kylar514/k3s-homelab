image:
  repository: ghcr.io/vectorize-io/hindsight
  tag: '0.9.2'
  pullPolicy: IfNotPresent

llm:
  provider: ollama
  model: gpt-oss:20b
  baseUrl: http://10.0.60.29:11434/v1

storage:
  storageClass: nfs-fast
  size: 32Gi

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: '2'
    memory: 4Gi

externalSecret:
  key: secret/hindsight
  property: groq-api-key
  accessKeyProperty: ui-access-key
  apiAccessKeyProperty: api-access-key
