image:
  repository: ghcr.io/vectorize-io/hindsight
  tag: '0.9.2'
  pullPolicy: IfNotPresent

llm:
  provider: groq
  model: openai/gpt-oss-20b

storage:
  storageClass: nfs-fast
  size: 32Gi

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: '2'
    memory: 4Gi

externalSecret:
  key: secret/hindsight
  property: groq-api-key
  accessKeyProperty: ui-access-key
  apiAccessKeyProperty: api-access-key
