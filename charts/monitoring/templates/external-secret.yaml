apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: grafana-admin
  data:
    - secretKey: admin-user
      remoteRef:
        key: {{ .Values.externalSecret.grafanaKey }}
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: {{ .Values.externalSecret.grafanaKey }}
        property: admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pve-exporter-auth
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: pve-exporter-auth
    template:
      data:
        # exporter wants the bare token name; PVE_USER carries monitoring@pve
        tokenName: exporter
        tokenValue: '{{ "{{ .token_value }}" }}'
  data:
    - secretKey: token_value
      remoteRef:
        key: {{ .Values.externalSecret.pveKey }}
        property: token_value
