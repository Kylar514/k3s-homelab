apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grafana.thenasus.com`)
      kind: Rule
      services:
        - name: grafana
          port: 80
  tls:
    certResolver: letsencrypt
---
# Log intake for hosts outside the cluster (nasus Alloy pushes here).
# klipper servicelb exposes it on every node, e.g. 10.0.40.8:3100.
apiVersion: v1
kind: Service
metadata:
  name: loki-push
  namespace: monitoring
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: single-binary
  ports:
    - name: http
      port: 3100
      targetPort: 3100
