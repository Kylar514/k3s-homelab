apiVersion: v1
kind: Service
metadata:
  name: adguard-secondary
  namespace: infra
spec:
  type: ExternalName
  externalName: 10.0.40.3
  ports:
    - name: http
      port: 80
      targetPort: 80

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: adguard-secondary
  namespace: infra
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`adguard2.thenasus.com`)
      kind: Rule
      services:
        - name: adguard-secondary
          port: 80
  tls:
    certResolver: letsencrypt
