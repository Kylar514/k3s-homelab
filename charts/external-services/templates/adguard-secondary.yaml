apiVersion: v1
kind: Service
metadata:
  name: adguard-secondary
  namespace: infra
spec:
  clusterIP: None
  ports:
    - name: http
      port: 80
      targetPort: 80

---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: adguard-secondary
  namespace: infra
  labels:
    kubernetes.io/service-name: adguard-secondary
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 80
endpoints:
  - addresses:
      - 10.0.40.4

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: adguard-secondary
  namespace: infra
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`adguard2.thenasus.com`)
      kind: Rule
      services:
        - name: adguard-secondary
          port: 80
  tls:
    certResolver: letsencrypt
