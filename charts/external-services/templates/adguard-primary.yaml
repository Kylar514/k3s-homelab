apiVersion: v1
kind: Service
metadata:
  name: adguard-primary
  namespace: infra
spec:
  clusterIP: None
  ports:
    - name: http
      port: 85
      targetPort: 85

---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: adguard-primary
  namespace: infra
  labels:
    kubernetes.io/service-name: adguard-primary
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 85
endpoints:
  - addresses:
      - 10.0.40.3

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: adguard-primary
  namespace: infra
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`adguard.thenasus.com`)
      kind: Rule
      services:
        - name: adguard-primary
          port: 85
  tls:
    certResolver: letsencrypt
