apiVersion: v1
kind: Service
metadata:
  name: adguard-primary
  namespace: infra
spec:
  type: ExternalName
  externalName: 10.0.40.3
  ports:
    - name: http
      port: 85
      targetPort: 85

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: adguard-primary
  namespace: infra
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`adguard.thenasus.com`)
      kind: Rule
      services:
        - name: adguard-primary
          port: 85
  tls:
    certResolver: letsencrypt
