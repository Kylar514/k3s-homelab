apiVersion: v1
kind: Service
metadata:
  name: wled-bookshelf
  namespace: infra
spec:
  type: ExternalName
  externalName: 10.0.60.30
  ports:
    - name: http
      port: 8080
      targetPort: 8080

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: wled-bookshelf
  namespace: infra
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`bookshelf.thenasus.com`)
      kind: Rule
      services:
        - name: wled-bookshelf
          port: 8080
  tls:
    certResolver: letsencrypt
