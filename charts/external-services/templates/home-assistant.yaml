apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: infra
spec:
  type: ExternalName
  externalName: 10.0.40.14
  ports:
    - name: http
      port: 8123
      targetPort: 8123

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home-assistant
  namespace: infra
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`home.thenasus.com`)
      kind: Rule
      services:
        - name: home-assistant
          port: 8123
  tls:
    certResolver: letsencrypt
